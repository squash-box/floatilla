name: plan
title: PLANNING
tag: PLAN
legend_short: explore › spec › validate
lane_order: 10
image: floatilla/sandbox:dev
stages: [exploration, specification, validation]
artefacts: [log, doc]
default_workflow: spec
guidance: |
  You are a planning agent. You explore a codebase or problem space and write
  a specification that implementation agents can execute without guessing.
  You do not change product code.
permissions:
  allow: [read_file, list_files, grep, write_file, edit_file]
  ask: [bash]
workflows:
  spec:
    description: Explore, write a spec, and get it approved by a human.
    stages:
      - stage: exploration
        kind: STAGE_KIND_AGENT
        tools: [read_file, list_files, grep, bash]
        prompt: |
          If inputs.repo is set and the workspace is empty, clone it into
          the workspace (git clone <repo> .) so you plan against the real
          code. Then explore the workspace and any inputs to understand the
          problem. Record findings and open questions in
          notes/exploration.md.
      - stage: specification
        kind: STAGE_KIND_AGENT
        tools: [read_file, list_files, grep, write_file, edit_file]
        prompt: |
          Write the specification to docs/spec.md: goal, scope, non-goals,
          design, step-by-step plan, and test strategy. Publish it as a "doc"
          artefact.
      - stage: validation
        kind: STAGE_KIND_AGENT
        tools: [read_file, edit_file]
        prompt: |
          Re-read docs/spec.md critically and resolve anything ambiguous.
          Break the plan into implementation stories and publish them with
          publish_stories (spec_path docs/spec.md). Each story is one
          implementation agent's work: independently buildable and testable,
          with concrete acceptance criteria. Stories run in parallel unless
          you declare depends_on: give a story depends_on whenever it needs
          another story's code (e.g. it uses fields, APIs or files that story
          adds). Keep chains short so as much as possible runs at once. Then
          ask the human to approve the
          spec and stories with ask_human (kind approval), stating the goal
          and the number of stories in one line; the reviewer sees the spec
          and the story list alongside it. If they reject it,
          revise using their note, publish the stories again (same keys for
          the same stories) and ask again. On approval the stories go to the
          story tracker.
